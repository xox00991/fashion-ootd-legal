<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connecting…</title>
<style>body{font-family:Georgia,serif;max-width:680px;margin:40px auto;padding:0 16px;line-height:1.6;color:#3a2a2a;background:#fff}code{word-break:break-all}</style></head>
<body><h1>Connecting your TikTok account…</h1>
<p id="msg">Passing the login back to the uploader on this computer.</p>
<script>
// TikTok Login Kit only allows https redirect URIs, so TikTok sends the login here.
// This page forwards the query (code, state, scopes or error) to the uploader running on this same computer.
(function(){
  var q = location.search || '';
  if (!q) { document.getElementById('msg').textContent = 'Nothing to pass on. Start the connection from the uploader on your computer.'; return; }
  location.replace('http://localhost:8723/callback/' + q);
})();
</script></body></html>
